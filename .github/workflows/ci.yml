name: Contract checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      UV_NO_PROGRESS: '1'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - run: python -m pip install --no-deps uv==0.10.7
      - run: uv sync --frozen --no-install-project
      - run: uv run --no-sync ruff check .
      - run: uv run --no-sync mypy src
      - run: uv run --no-sync pytest tests/unit tests/protocol -q
      - run: uv export --frozen --no-dev --no-emit-project --format requirements-txt --output-file requirements.lock
      - run: git diff --exit-code -- requirements.lock
      - run: uv build
      - run: uv run --no-sync python scripts/check_distribution.py dist

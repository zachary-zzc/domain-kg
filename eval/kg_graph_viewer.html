<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>__TITLE__ · 证据图</title>
<style>
:root{font-family:system-ui,-apple-system,"PingFang SC",sans-serif;color:#172c38;background:#f4f7f9}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px 16px;background:#102d3b;color:#fff}h1{font-size:21px;margin:0 0 6px}header p{margin:0;color:#b6d3df;font-size:13px}.bar{display:flex;gap:10px;padding:14px 24px;background:#fff;align-items:center;border-bottom:1px solid #d7e1e7;flex-wrap:wrap}input,select,button{font:inherit;font-size:13px;border:1px solid #b5c8d2;border-radius:6px;padding:9px;background:#fff;color:#173c4d}input{width:260px}button{cursor:pointer}button:hover{background:#e9f3f6}.primary{background:#156780;color:#fff;border-color:#156780}.primary:hover{background:#10556b}main{display:grid;grid-template-columns:280px minmax(320px,1fr) 340px;height:calc(100vh - 208px);min-height:480px}.list,.detail{padding:18px;background:#fff;overflow:auto}.list{border-right:1px solid #d7e1e7}.detail{border-left:1px solid #d7e1e7}.stage{position:relative;overflow:hidden;background:radial-gradient(#e0e9ed 1px,transparent 1px);background-size:18px 18px}canvas{width:100%;height:100%;display:block}.caption{position:absolute;left:16px;top:14px;right:16px;font-size:12px;color:#4c6876;pointer-events:none;background:#f4f7f9db;padding:8px;border-radius:6px}.small{font-size:12px;line-height:1.65;color:#627884}.label{font-size:11px;text-transform:uppercase;letter-spacing:1px;color:#6b8490;margin-bottom:10px}.item{display:block;width:100%;border:0;border-bottom:1px solid #e7eef2;text-align:left;border-radius:0;padding:12px 6px;word-break:break-word}.item strong{font-size:13px}.item span{display:block;font-size:11px;color:#6a7b84;margin-top:4px}.detail h2{font-size:18px;overflow-wrap:anywhere}.edge{padding:12px 0;border-bottom:1px solid #dde7eb}.edge button{font-size:12px;text-align:left;width:100%}.quote{white-space:pre-wrap;overflow-wrap:anywhere;font-size:13px;line-height:1.65;background:#f1f6f8;padding:12px;border-left:3px solid #398c9c}.tag{display:inline-block;border-radius:12px;background:#e6f1f4;padding:3px 8px;font-size:11px;color:#156780;margin-right:4px}.danger{color:#b73c4e;background:#fae9ed}footer{padding:12px 24px;font-size:12px;background:#e7eef2;color:#47616f}.toggle{font-size:12px;white-space:nowrap}.toggle input{width:auto}.empty{padding:20px 0;color:#6a7b84}@media(max-width:1000px){main{grid-template-columns:220px 1fr}.detail{position:absolute;right:0;top:240px;max-height:55vh;width:300px;box-shadow:0 3px 20px #19334222}.bar{padding:10px}header{padding:18px}input{width:200px}}
</style>
<header><h1 id="title"></h1><p>来源证据图 · 节点可检索，关系可回溯 · 完整数据内置，可离线打开</p></header>
<div class="bar"><input id="query" aria-label="搜索节点或原文标题" placeholder="搜索节点或原文标题…"><select id="dataset" aria-label="数据集"><option value="">全部数据集</option></select><button id="search" class="primary">搜索</button><label class="toggle"><input id="bridge" type="checkbox"> 展开同名线索（未核实）</label><button id="fit">重置视图</button><button id="json">下载完整 JSON</button><button id="png">保存当前图 PNG</button></div>
<main><aside class="list"><div class="label">全图统计</div><div id="stats"></div><p class="small">节点按来源隔离；不同材料中的同名节点不会自动合并。当前画布显示所选节点的两跳邻居，最多 180 个节点。</p><div class="label">搜索结果 / 起始节点</div><div id="results"></div></aside><section class="stage"><canvas id="graph" aria-label="知识图谱节点关系画布"></canvas><div class="caption" id="caption">拖动节点调整布局；拖动画布平移；滚轮缩放；点击节点查看关系证据。</div></section><aside class="detail" id="detail"><div class="label">节点与原文</div><p class="small">点击左侧节点或图中的圆点查看来源和关系。关系是模型构建的候选事实，引用真实不代表关系一定正确。</p></aside></main>
<footer>实线：正向事实　红色虚线：否定　灰色虚线：不确定　橙色虚线：同名检索线索（不是事实关系）。当前画布不是全图截断导出；完整 JSON 包含所有节点、边和原文。</footer>
<script id="data" type="application/json">__GRAPH_DATA__</script>
<script>
'use strict';
const G=JSON.parse(document.getElementById('data').textContent), byId=new Map(G.nodes.map(n=>[n.id,n])), docs=new Map(G.sources.map(d=>[d.id,d]));
const adjacency=new Map(), hints=new Map(); for(const n of G.nodes){adjacency.set(n.id,[]); if(!hints.has(n.hint_id))hints.set(n.hint_id,[]); hints.get(n.hint_id).push(n.id)}for(const e of G.edges){adjacency.get(e.from).push(e); if(e.to!==e.from)adjacency.get(e.to).push(e)}
const $=id=>document.getElementById(id), colors={hotpot:'#287ea1',musique:'#72924e',drop:'#b87933',squad:'#9874b3'}, canvas=$('graph'),ctx=canvas.getContext('2d');
$('title').textContent=G.name; $('stats').textContent=G.nodes.length.toLocaleString()+' 节点 · '+G.edges.length.toLocaleString()+' 关系 · '+G.sources.length.toLocaleString()+' 原文段落';
for(const d of [...new Set(G.sources.map(d=>d.dataset))].sort()){const o=document.createElement('option');o.value=d;o.textContent=d;$('dataset').appendChild(o)}
let visible=[],links=[],positions=new Map(),center=null,zoom=1,offset={x:0,y:0},drag=null,simulation=0,focused=null;
function el(tag,text,cls){const n=document.createElement(tag);if(text!==undefined)n.textContent=text;if(cls)n.className=cls;return n}
function allowed(n){return !$('dataset').value||n.dataset===$('dataset').value}
function search(){const q=$('query').value.toLocaleLowerCase().trim();let items=G.nodes.filter(n=>allowed(n)&&(!q||n.label.toLocaleLowerCase().includes(q)||docs.get(n.source).title.toLocaleLowerCase().includes(q)));items.sort((a,b)=>adjacency.get(b.id).length-adjacency.get(a.id).length||a.label.localeCompare(b.label));const results=$('results');results.replaceChildren();results.appendChild(el('p',items.length.toLocaleString()+' 个节点匹配；列出前 80 个。','small'));for(const n of items.slice(0,80)){const b=el('button',undefined,'item');b.appendChild(el('strong',n.label));b.appendChild(el('span',n.dataset+' · '+docs.get(n.source).title+' · '+adjacency.get(n.id).length+' 条关系'));b.onclick=()=>focus(n.id);results.appendChild(b)}if(items.length)focus(items[0].id);else{visible=[];links=[];focused=null;$('detail').replaceChildren(el('p','没有匹配节点。','empty'));draw()}}
function focus(id){focused=id;const selected=new Set([id]);let frontier=[id];for(let h=0;h<2;h++){const next=[];for(const v of frontier){for(const e of adjacency.get(v)||[]){for(const k of[e.from,e.to])if(!selected.has(k)&&allowed(byId.get(k))&&selected.size<180){selected.add(k);next.push(k)}}if($('bridge').checked){for(const k of hints.get(byId.get(v).hint_id)||[])if(!selected.has(k)&&allowed(byId.get(k))&&selected.size<180){selected.add(k);next.push(k)}}}frontier=next}visible=[...selected].map(k=>byId.get(k));links=G.edges.filter(e=>selected.has(e.from)&&selected.has(e.to));if($('bridge').checked){const groups=new Map();for(const n of visible){if(!groups.has(n.hint_id))groups.set(n.hint_id,[]);groups.get(n.hint_id).push(n.id)}for(const ids of groups.values())for(let i=1;i<ids.length;i++)links.push({from:ids[0],to:ids[i],hint:true,predicate:'同名线索'})}positions=new Map(visible.map((n,i)=>[n.id,{x:Math.cos(i*2*Math.PI/visible.length)*150,y:Math.sin(i*2*Math.PI/visible.length)*150,vx:0,vy:0}]));positions.set(id,{x:0,y:0,vx:0,vy:0});zoom=1;offset={x:0,y:0};simulation=150;details(id);animate()}
function details(id){const n=byId.get(id),d=docs.get(n.source),box=$('detail');box.replaceChildren(el('div','节点与原文','label'),el('h2',n.label));box.appendChild(el('span',n.dataset,'tag'));box.appendChild(el('p',d.title,'small'));box.appendChild(el('p','来源 ID：'+d.id,'small'));const original=el('details');original.appendChild(el('summary','展开完整原文'));original.appendChild(el('p',d.text,'quote'));box.appendChild(original);for(const e of adjacency.get(id)){const other=byId.get(e.from===id?e.to:e.from),row=el('div',undefined,'edge');const b=el('button',byId.get(e.from).label+' → '+e.predicate+' → '+byId.get(e.to).label);b.onclick=()=>focus(other.id);row.appendChild(b);row.appendChild(el('span',e.polarity,e.polarity==='negative'?'tag danger':'tag'));if(e.qualifiers.length)row.appendChild(el('p',e.qualifiers.map(q=>q.name+': '+q.value).join('；'),'small'));row.appendChild(el('p',e.quote,'quote'));box.appendChild(row)}if($('bridge').checked){const others=hints.get(n.hint_id).filter(k=>k!==id);if(others.length)box.appendChild(el('p','同名候选 '+others.length+' 个；仅供探索，不等于同一实体。','small'))}$('caption').textContent='显示 '+visible.length+' / '+G.nodes.length+' 个节点，'+links.filter(e=>!e.hint).length+' 条事实；点击节点看原文。拖动、缩放可调整。'}
function size(){const r=canvas.getBoundingClientRect(),d=window.devicePixelRatio||1;if(canvas.width!==Math.round(r.width*d)||canvas.height!==Math.round(r.height*d)){canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d)}return{w:r.width,h:r.height,d}}
function draw(){const {w,h,d}=size();ctx.setTransform(d,0,0,d,0,0);ctx.clearRect(0,0,w,h);ctx.translate(w/2+offset.x,h/2+offset.y);ctx.scale(zoom,zoom);for(const e of links){const a=positions.get(e.from),b=positions.get(e.to);ctx.strokeStyle=e.hint?'#d99e4f':e.polarity==='negative'?'#ce586c':'#a2bac7';ctx.lineWidth=e.hint?1:1.4;ctx.setLineDash(e.hint||e.polarity!=='positive'?[5,4]:[]);ctx.beginPath();ctx.moveTo(a.x,a.y);ctx.lineTo(b.x,b.y);ctx.stroke();if(!e.hint){const t=Math.atan2(b.y-a.y,b.x-a.x),x=b.x-Math.cos(t)*11,y=b.y-Math.sin(t)*11;ctx.beginPath();ctx.moveTo(x,y);ctx.lineTo(x-6*Math.cos(t-.5),y-6*Math.sin(t-.5));ctx.lineTo(x-6*Math.cos(t+.5),y-6*Math.sin(t+.5));ctx.closePath();ctx.fillStyle=ctx.strokeStyle;ctx.fill();if(visible.length<=30){ctx.fillStyle='#536d7b';ctx.font='10px system-ui';ctx.textAlign='center';ctx.fillText(e.predicate,(a.x+b.x)/2,(a.y+b.y)/2-4)}}}ctx.setLineDash([]);for(const n of visible){const p=positions.get(n.id);ctx.beginPath();ctx.arc(p.x,p.y,n.id===focused?10:7,0,Math.PI*2);ctx.fillStyle=colors[n.dataset]||'#378999';ctx.fill();if(n.id===focused){ctx.strokeStyle='#102d3b';ctx.lineWidth=3;ctx.stroke()}if(visible.length<=70||n.id===focused){ctx.font=(n.id===focused?'600 ':'')+'11px system-ui';ctx.textAlign='center';ctx.fillStyle='#193d4e';const label=n.label.length>40?n.label.slice(0,39)+'…':n.label;ctx.fillText(label,p.x,p.y+22)}}}
function animate(){if(simulation>0){for(const n of visible){const a=positions.get(n.id);a.vx*=.7;a.vy*=.7;for(const other of visible){if(n.id===other.id)continue;const b=positions.get(other.id),dx=a.x-b.x,dy=a.y-b.y,r2=dx*dx+dy*dy+200;a.vx+=dx*50/r2;a.vy+=dy*50/r2}a.vx-=a.x*.002;a.vy-=a.y*.002}for(const e of links){const a=positions.get(e.from),b=positions.get(e.to),dx=b.x-a.x,dy=b.y-a.y,len=Math.max(1,Math.hypot(dx,dy)),f=(len-130)*.009;a.vx+=dx/len*f;a.vy+=dy/len*f;b.vx-=dx/len*f;b.vy-=dy/len*f}for(const n of visible){if(drag&&drag.node===n.id)continue;const a=positions.get(n.id);a.x+=a.vx;a.y+=a.vy}simulation--;draw();requestAnimationFrame(animate)}else draw()}
function point(ev){const r=canvas.getBoundingClientRect();return{x:(ev.clientX-r.left-r.width/2-offset.x)/zoom,y:(ev.clientY-r.top-r.height/2-offset.y)/zoom}}
canvas.onpointerdown=ev=>{const p=point(ev),n=visible.find(n=>Math.hypot(positions.get(n.id).x-p.x,positions.get(n.id).y-p.y)<12/zoom);drag={node:n?.id,x:ev.clientX,y:ev.clientY,moved:false};canvas.setPointerCapture(ev.pointerId)};
canvas.onpointermove=ev=>{if(!drag)return;const dx=ev.clientX-drag.x,dy=ev.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>2)drag.moved=true;if(drag.node){const p=point(ev);positions.get(drag.node).x=p.x;positions.get(drag.node).y=p.y}else{offset.x+=dx;offset.y+=dy}drag.x=ev.clientX;drag.y=ev.clientY;draw()};
canvas.onpointerup=()=>{if(drag?.node&&!drag.moved){focused=drag.node;details(drag.node);draw()}drag=null};canvas.onwheel=ev=>{ev.preventDefault();zoom=Math.max(.15,Math.min(4,zoom*(ev.deltaY>0?.9:1.1)));draw()};
function download(blob,name){const url=URL.createObjectURL(blob),a=el('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}
$('json').onclick=()=>download(new Blob([JSON.stringify(G)],{type:'application/json'}),G.name+'.json');$('png').onclick=()=>canvas.toBlob(blob=>download(blob,G.name+'-view.png'));
$('search').onclick=search;$('query').onkeydown=e=>{if(e.key==='Enter')search()};$('dataset').onchange=search;$('bridge').onchange=()=>{if(focused)focus(focused)};$('fit').onclick=()=>{if(focused)focus(focused)};window.onresize=draw;search();
</script></html>

[project]
name = "domain-kg"
version = "0.1.0"
description = "Permission-aware evidence knowledge graphs with scoped LightRAG adapters"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.143.2",
  "mcp==2.3.0",
  "lightrag-hku==1.5.7",
  "pydantic-settings==2.16.0",
  "pymongo==4.19.0",
  "neo4j==6.4.1",
  "qdrant-client==1.19.1",
  "boto3==1.43.114",
  "uvicorn==0.54.0",
  "pyjwt[crypto]==2.15.1",
  "docling-parse==7.22.3",
  "pypdf==6.20.1",
  "pillow==12.3.0",
  "defusedxml==0.7.1",
  "jinja2==3.1.6",
  "openpyxl==3.1.5",
  "python-pptx==1.0.2",
  "xlrd==2.0.2",
  "semantic-text-splitter==0.33.1",
]

[dependency-groups]
dev = [
  "pytest==9.1.1",
  "pytest-asyncio==1.4.0",
  "httpx==0.28.1",
  "ruff==0.17.1",
  "mypy==2.4.0",
  "types-openpyxl>=3.1.5.20261017",
  "types-xlrd>=2.0.0.20260518",
]

[build-system]
requires = ["hatchling==1.32.4"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/domain_kg"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = [".", "src", "tests/integration"]
markers = ["storage: requires the resource-limited local Compose services", "physical: sequential independent graph/vector deployment drill"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = "stubs"

[[tool.mypy.overrides]]
module = ["lightrag.*", "boto3.*", "botocore.*", "defusedxml.*"]
ignore_missing_imports = true

[tool.hatch.build.targets.sdist]
include = [
  "/src/domain_kg",
  "/pyproject.toml",
  "/README.md",
  "/uv.lock",
  "/requirements.lock",
  "/stubs",
  "/LICENSE*",
]

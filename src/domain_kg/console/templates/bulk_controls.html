{% if can_edit %}
<form id="bulk-management" class="bulk-controls card" method="post" action="/admin/kgs/{{ kg.id }}/batch" data-bulk-form data-bulk-scope="{{ bulk_scope }}" data-selected-message="{{ _('Selected: {count}') }}" data-confirm-delete="{{ _('Delete {count} selected sources? They leave the KG immediately and can be restored during retention. Independently supported facts remain.') }}" data-confirm-process="{{ _('Process {count} selected sources with the current models? This may incur provider charges. Published versions remain available until replacements pass verification.') }}">
<input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="idempotency_key" value="batch-{{ command_key }}"><input type="hidden" name="items" value="[]">
<div class="form-row"><label><input type="checkbox" data-bulk-all> {{ _('Select this page') }}</label><span data-bulk-count role="status" aria-live="polite">{{ _('Selected: {count}').replace('{count}', '0') }}</span>
<button class="quiet" type="button" data-bulk-clear>{{ _('Clear selection') }}</button>{% if bulk_kind == 'jobs' %}<button class="quiet" type="button" data-bulk-retryable>{{ _('Select retryable jobs') }}</button>{% endif %}</div>
<div class="input-action"><select name="operation" aria-label="{{ _('Batch operation') }}" required><option value="">{{ _('Choose an operation') }}</option>
{% if bulk_kind == 'jobs' %}<option value="retry">{{ _('Retry selected jobs') }}</option><option value="cancel">{{ _('Cancel selected jobs') }}</option>
{% else %}{% if bulk_kind == 'removed' %}<option value="restore">{{ _('Restore selected sources') }}</option>{% else %}<option value="process">{{ _('Process selected sources') }}</option><option value="delete">{{ _('Delete selected sources') }}</option>{% endif %}{% endif %}</select><button type="submit" data-bulk-submit disabled>{{ _('Apply to selection') }}</button></div>
<p class="field-help">{{ _('Up to 100 items per batch. Each item is checked separately; a failure does not block other items. Submitted jobs continue in the background.') }}</p>
<noscript><p class="notice">{{ _('Enable JavaScript for batch selection. Individual actions remain available.') }}</p></noscript>
</form>{% endif %}

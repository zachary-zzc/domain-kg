{% extends "base.html" %}
{% block content %}<p>{{ _("Material grants narrow existing KG membership. They cannot grant access to a KG.") }}</p><form method="post" class="card"><input type="hidden" name="csrf_token" value="{{ csrf }}"><input type="hidden" name="expected_revision" value="{{ acl.policy_revision }}"><input type="hidden" name="idempotency_key" value="acl-{{ command_key }}"><label for="mode">{{ _("Visibility") }}</label><select id="mode" name="acl_mode"><option value="kg" {% if acl.acl_mode == 'kg' %}selected{% endif %}>{{ _("KG members") }}</option><option value="restricted" {% if acl.acl_mode == 'restricted' %}selected{% endif %}>{{ _("Selected members and groups") }}</option></select><label for="members">{{ _("Member identifiers, separated by commas") }}</label><textarea id="members" name="member_ids">{{ acl.member_ids|join(', ') }}</textarea><label for="groups">{{ _("Group identifiers, separated by commas") }}</label><textarea id="groups" name="group_ids">{{ acl.group_ids|join(', ') }}</textarea><button type="submit">{{ _("Save material access") }}</button></form>{% endblock %}
